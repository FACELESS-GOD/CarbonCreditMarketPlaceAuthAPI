syntax = "proto3";

package pb ;

import "google/protobuf/timestamp.proto";

option go_package = "CarbonCreditMarketPlaceAuthAPI/pb";

message LoginUserRequest {
  string email    = 1 ;
  string password = 2 ;
}

message LoginUserResponse {
  string                    token                     = 1;
  string                    session_id                = 2 ;
  string                    access_token              = 3 ;
  string                    referesh_token            = 4 ;
  google.protobuf.Timestamp access_token_expires_at   = 5 ;
  google.protobuf.Timestamp referesh_token_expires_at = 6 ;
}
